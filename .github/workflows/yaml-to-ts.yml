name: 'Deploy @efebia/yaml-to-ts'

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths: ['packages/yaml-to-ts/**', '.github/workflows/yaml-to-ts.yml']

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    uses: ./.github/workflows/common-deploy.yml
    with:
      package-name: "@efebia/yaml-to-ts"
