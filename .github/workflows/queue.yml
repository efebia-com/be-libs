name: 'Deploy @efebia/queue'

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths: ['packages/queue/**', '.github/workflows/queue.yml']

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    uses: ./.github/workflows/common-deploy.yml
    with:
      package-name: "@efebia/queue"
