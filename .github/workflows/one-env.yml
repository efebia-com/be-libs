name: 'Deploy @efebia/one-env'

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths: ['packages/one-env/**', '.github/workflows/one-env.yml']

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    uses: ./.github/workflows/common-deploy.yml
    with:
      package-name: "@efebia/one-env"
